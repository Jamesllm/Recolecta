# App web de Recolecta+: archivos estáticos de «expo export» con rutas del lado del cliente (Expo Router)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cualquier ruta de la app (/driver, /report/12, …) la resuelve index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Los archivos con huella en el nombre no cambian: se guardan en caché
    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
