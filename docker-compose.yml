# Recolecta+ completo con Docker: base de datos PostGIS, API (con la IA), panel municipal y app web.
#   1. cp .env.example .env   (y completar JWT_SECRET)
#   2. docker compose up --build
# Panel: http://localhost:3000 · App web: http://localhost:8081 · API: http://localhost:4000/api/health
name: recolecta

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recolecta}
      POSTGRES_DB: ${DB_NAME:-recolecta_plus}
    ports:
      - "${DB_PORT_HOST:-5433}:5432" # 5433 para no chocar con un PostgreSQL instalado en la PC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-recolecta_plus}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-recolecta}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env (vea .env.example)}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081,http://${PUBLIC_HOST:-localhost}:3000,http://${PUBLIC_HOST:-localhost}:8081
      PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:4000
      # Fotos: «local» las guarda en el volumen «uploads»; «s3» usa las credenciales de abajo
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      # Correo: sin SMTP_HOST los mensajes se muestran en el registro de la API
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Recolecta+ <no-responder@recolecta.pe>}
      OSRM_URL: ${OSRM_URL:-}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

  panel:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:4000/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  app:
    build:
      context: ./mobile
      args:
        EXPO_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:4000/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  db-data:
  uploads:
