# Recolecta+ con Docker: API (con la IA), panel municipal y app web.
# La base de datos es PostgreSQL con PostGIS en Neon (DATABASE_URL); no se levanta un contenedor de base.
#   1. cp .env.example .env   (y completar DATABASE_URL y JWT_SECRET)
#   2. docker compose up --build
# Panel: http://localhost:3000 · App web: http://localhost:8081 · API: http://localhost:4000/api/health
name: recolecta

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      # Cadena de conexión de Neon (con sslmode=require); la API y el servicio de IA la usan
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL en el archivo .env (vea .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env (vea .env.example)}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081,http://${PUBLIC_HOST:-localhost}:3000,http://${PUBLIC_HOST:-localhost}:8081
      PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:4000
      # Fotos: «s3» usa las credenciales de abajo; «local» las guarda en el volumen «uploads»
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      # Correo: sin SMTP_HOST los mensajes se muestran en el registro de la API
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Recolecta+ <no-responder@recolecta.pe>}
      OSRM_URL: ${OSRM_URL:-}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

  panel:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:4000/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  app:
    build:
      context: ./mobile
      args:
        EXPO_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:4000/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  uploads:
